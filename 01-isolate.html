<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 1 — Isolate trigger components</title>
<link rel="stylesheet" href="../phase0/01-ui.css">
<style id="s">
@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }
</style>
</head>
<body>
<div id="status">pick a test via URL ?t=</div>
<div id="log"></div>
<script src="../phase0/00-logger.js"></script>
<script>
/*
 * Phase 0 findings on PS4 13.50:
 *   original (load + then + deleteRule)     → consistent crash
 *   no-delete  (load + then, no deleteRule) → then fires, NetworkError, survives
 *   no-then    (load only)                  → load resolves, survives
 *   direct     (A.load().then + deleteRule) → then fires, resolves, survives
 *
 * Conclusion: crash needs document.fonts.load('1em x','AB') + deleteRule during then.
 * Refresh page between every test.
 */

function hookThen(A, body) {
    let fired = false;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get() {
            ps4log('then getter, this===A: ' + (this === A));
            if (!fired && this === A) {
                fired = true;
                body();
            }
            return undefined;
        }
    });
}

function setupA() {
    let A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;
    return A;
}

const tests = {
    // baseline — should crash like test.html
    original: function () {
        let A = setupA();
        hookThen(A, function () {
            new FontFace('y', 'local(Helvetica Bold)', { unicodeRange: 'U+0041' });
            new FontFace('z', 'local(Helvetica Italic)', { unicodeRange: 'U+0041' });
            document.getElementById('s').sheet.deleteRule(0);
            document.body.offsetTop;
        });
        document.fonts.load('1em x', 'AB');
    },

    // is deleteRule alone enough (no y/z, no layout)?
    'delete-only': function () {
        let A = setupA();
        hookThen(A, function () {
            document.getElementById('s').sheet.deleteRule(0);
        });
        document.fonts.load('1em x', 'AB');
    },

    // is layout flush required?
    'delete-layout': function () {
        let A = setupA();
        hookThen(A, function () {
            document.getElementById('s').sheet.deleteRule(0);
            document.body.offsetTop;
        });
        document.fonts.load('1em x', 'AB');
    },

    // are y/z FontFaces required?
    'delete-yz': function () {
        let A = setupA();
        hookThen(A, function () {
            new FontFace('y', 'local(Helvetica Bold)', { unicodeRange: 'U+0041' });
            new FontFace('z', 'local(Helvetica Italic)', { unicodeRange: 'U+0041' });
            document.getElementById('s').sheet.deleteRule(0);
        });
        document.fonts.load('1em x', 'AB');
    },

    // does load text matter? A only vs AB
    'text-A': function () {
        let A = setupA();
        hookThen(A, function () {
            document.getElementById('s').sheet.deleteRule(0);
            document.body.offsetTop;
        });
        document.fonts.load('1em x', 'A');
    },

    'text-B': function () {
        let A = setupA();
        hookThen(A, function () {
            document.getElementById('s').sheet.deleteRule(0);
            document.body.offsetTop;
        });
        document.fonts.load('1em x', 'B');
    },

    // CSS bad URL only — no JS FontFace A
    'css-only': function () {
        document.fonts.load('1em x', 'B');
    }
};

const t = new URLSearchParams(location.search).get('t') || 'original';

window.onload = function () {
    ps4log('Phase 1 isolate: ' + t);
    ps4log('UA: ' + navigator.userAgent);
    ps4log('REFRESH PAGE BETWEEN EACH TEST');
    ps4status('running: ' + t, '#ff0');

    if (!tests[t]) {
        ps4log('unknown test. options: ' + Object.keys(tests).join(', '));
        return;
    }

    tests[t]();
    ps4log('trigger dispatched');

    setTimeout(function () {
        ps4status('survived 3s — test: ' + t, '#0f0');
        ps4log('still alive after 3s');
    }, 3000);
};
</script>
</body>
</html>
