<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 3 — Stale B render probe</title>
<style>
body { font-family: monospace; background: #111; color: #0f0; padding: 12px; }
#status { font-size: 18px; margin-bottom: 8px; }
#log { height: 55vh; overflow: auto; border: 1px solid #333; padding: 8px; font-size: 12px; }
#t { font-family: x, sans-serif; font-size: 200px; color: #fff; line-height: 1; }
.note { color: #aaa; font-size: 12px; margin-bottom: 8px; }
</style>
<style id="s">
@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }
</style>
</head>
<body>
<div id="status">stale B probe...</div>
<p class="note">After deleteRule, check('B')=true but load('B')=0. Force render of B via font x.</p>
<div id="log"></div>
<div id="t">B</div>
<script>
(function () {
    var logEl = document.getElementById('log');
    var statusEl = document.getElementById('status');
    window.ps4log = function (msg) {
        var line = document.createElement('div');
        line.textContent = '[' + performance.now().toFixed(1) + 'ms] ' + msg;
        logEl.appendChild(line);
    };
    window.ps4status = function (msg, color) {
        statusEl.textContent = msg;
        if (color) statusEl.style.color = color;
    };
})();

function measureB(label) {
    var el = document.getElementById('t');
    el.textContent = 'B';
    el.style.fontFamily = 'x, sans-serif';
    var w = el.offsetWidth;
    var h = el.offsetHeight;
    ps4log(label + ': offset ' + w + 'x' + h + ', check(B)=' + document.fonts.check('200px x', 'B'));
    return { w: w, h: h };
}

window.onload = function () {
    ps4log('Phase 3d — stale B render probe');
    ps4log('UA: ' + navigator.userAgent);

    measureB('before trigger');

    var A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;

    var fired = false;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get: function () {
            if (!fired && this === A) {
                fired = true;
                ps4log('TRIGGER FIRED — deleteRule');
                document.getElementById('s').sheet.deleteRule(0);
                measureB('inside trigger after deleteRule');
                document.body.offsetTop;
            }
            return undefined;
        }
    });

    document.fonts.load('1em x', 'AB');
    ps4log('load(AB) dispatched');

    setTimeout(function () {
        measureB('after trigger 500ms');

        ps4log('check(A)=' + document.fonts.check('1em x', 'A'));
        ps4log('check(B)=' + document.fonts.check('1em x', 'B'));
        ps4log('check(AB)=' + document.fonts.check('1em x', 'AB'));

        document.fonts.load('1em x', 'B').then(function (f) {
            ps4log('load(B) count=' + f.length);
        }).catch(function (e) {
            ps4log('load(B) err=' + e);
        });

        // force paint: AB, A only, B only
        var el = document.getElementById('t');
        el.textContent = 'AB';
        ps4log('render AB: ' + el.offsetWidth + 'x' + el.offsetHeight);

        el.textContent = 'B';
        ps4log('render B alone: ' + el.offsetWidth + 'x' + el.offsetHeight);

        el.textContent = 'A';
        ps4log('render A alone: ' + el.offsetWidth + 'x' + el.offsetHeight);

        // second trigger attempt — reload CSS face then delete again?
        ps4status('done — compare B measurements', '#0f0');
    }, 500);
};
</script>
</body>
</html>
